# Linux packages (.deb, .rpm, and Arch's, recompressed to .pkg.tar.xz) from one release build.
# The release workflow sets ARCH (amd64 or arm64) and VERSION, and puts the binary in dist/.
name: better-matrix
arch: ${ARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Better Matrix <m43i@users.noreply.github.com>
description: |
  A Matrix client built around several accounts side by side, with encrypted chats,
  voice and video calls, threads and polls.
vendor: Better Matrix
homepage: https://github.com/m43i/better-matrix
license: MIT

contents:
  - src: dist/better-matrix
    dst: /usr/bin/better-matrix
    file_info:
      mode: 0755
  - src: packaging/linux/chat.bettermatrix.desktop.desktop
    dst: /usr/share/applications/chat.bettermatrix.desktop.desktop
  - src: apps/desktop/assets/icon.svg
    dst: /usr/share/icons/hicolor/scalable/apps/better-matrix.svg
  - src: packaging/icons/better-matrix-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/better-matrix.png
  - src: packaging/icons/better-matrix-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/better-matrix.png
  - src: LICENSE
    dst: /usr/share/licenses/better-matrix/LICENSE

# What the binary links (ALSA, GLib, GStreamer for video), and what it loads when there (keyboard
# maps, Wayland, the GPU through Vulkan, PipeWire for screen sharing, GStreamer's codecs).
overrides:
  # Built on Ubuntu 22.04: glibc 2.35 or later (RHEL 9's 2.34 is too old).
  deb:
    depends:
      - libc6 (>= 2.35)
      - libasound2t64 | libasound2
      - libglib2.0-0t64 | libglib2.0-0
      - libgstreamer1.0-0
      - libgstreamer-plugins-base1.0-0
      # playbin, the player itself, and MP4, WebM and VP8/VP9.
      - gstreamer1.0-plugins-base
      - gstreamer1.0-plugins-good
    recommends:
      # H.264 and HEVC, which phones record.
      - gstreamer1.0-libav
      - libxkbcommon0
      - libwayland-client0
      - libvulkan1
      - mesa-vulkan-drivers
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
  rpm:
    depends:
      - libc.so.6(GLIBC_2.35)(64bit)
      - alsa-lib
      - glib2
      # GStreamer by its libraries, and its plugins (playbin; MP4, WebM, VP8/VP9) by either name:
      # Fedora and openSUSE package them differently.
      - libgstreamer-1.0.so.0()(64bit)
      - libgstapp-1.0.so.0()(64bit)
      - libgstvideo-1.0.so.0()(64bit)
      - (gstreamer1-plugins-base or gstreamer-plugins-base)
      - (gstreamer1-plugins-good or gstreamer-plugins-good)
    recommends:
      # H.264 and AAC, which phones record, by the GStreamer elements both distributions'
      # packages provide; a weak dependency nothing provides is skipped.
      - gstreamer1(element-openh264dec)()(64bit)
      - gstreamer1(element-avdec_aac)()(64bit)
      - libxkbcommon
      - libwayland-client
      - vulkan-loader
      - mesa-vulkan-drivers
      - pipewire-libs
  archlinux:
    depends:
      - alsa-lib
      - glib2
      - gstreamer
      - gst-plugins-base
      - gst-plugins-good
      - gst-libav
      - libxkbcommon
      - wayland
      - vulkan-icd-loader
    suggests:
      - pipewire
