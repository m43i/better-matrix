[package]
name = "better-matrix-desktop"
description = "Better Matrix for Linux, macOS and Windows, rendered with Rune."
version.workspace = true
edition.workspace = true
license.workspace = true

build = "build.rs"

[[bin]]
name = "better-matrix"
path = "src/main.rs"

[features]
# Live Rust editing with Rune's `scripts/rune-dev` (see `.agent-tools/rune/docs/rune.md`).
hot = ["rune/hot"]
# Rune's per-frame log: `RUNE_FRAME_LOG=frames.jsonl` writes each drawn frame, its cost and what
# asked for it (`.agent-tools/rune/docs/rune.md`).
frame-profile = ["rune/frame-profile"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
# Renders PDF pages for the attachment preview: pure Rust, so every platform previews without a system library.
hayro = "0.9"
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
  "ico",
] }
keyring = { version = "3", features = [
  "apple-native",
  "windows-native",
  "async-secret-service",
  "async-io",
  "crypto-rust",
] }
matrix-core = { workspace = true, features = ["client", "native-media"] }
# Release checks and verified update archives, on the shell's worker thread.
reqwest = { version = "0.13.5", default-features = false, features = [
  "blocking",
  "json",
  "rustls",
] }
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The widget window: the token its bridge proves messages with, and its page's origin.
getrandom.workspace = true
url.workspace = true
# The widget window (`--widget-window`): a room's widget in the system's web view, in a process
# of its own beside the app (WebKitGTK, WKWebView, WebView2).
tao = "0.38.0"
tempfile = "3"
zip = { version = "9.5.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }
wry = "0.58.1"
rune = { workspace = true, features = ["native-file-dialog"] }
rune-i18n.workspace = true
rune-kit.workspace = true
# Sound the app plays and records itself (voice messages, audio files, the ring), on the device
# the user picked: decoders in pure Rust, cpal for the device.
cpal = "0.18"
# Every emoji with its name and shortcodes, for the picker's search.
emojis = "0.9"
opuscule = "0.2"
# Logs to stderr, only when RUST_LOG asks for them.
tracing-subscriber.workspace = true
symphonia = { version = "0.5.5", default-features = false, features = [
  "ogg",
  "vorbis",
  "mkv",
  "wav",
  "pcm",
  "mp3",
  "aac",
  "isomp4",
  "flac",
] }

[build-dependencies]
rune-i18n = { workspace = true, features = ["codegen"] }
# The Windows executable's icon and version resources (build.rs).
embed-resource = "3"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
rune-notify.workspace = true
# AppKit status items and a Windows tray that re-registers after Explorer restarts.
tray-icon = { version = "0.27", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Devices_Geolocation"] }
windows-future = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
# Tray registration must report whether there is a host that can actually show the item.
ksni = { version = "0.3.8", default-features = false, features = ["async-io"] }
async-io = "2"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Cancellable Zenity fallback when the XDG file chooser is unavailable.
async-channel = "2"
async-process = "2"
# Notifications: one session-bus connection shows them and hears their clicks.
zbus = { version = "6", default-features = false, features = ["default-rt"] }
futures-lite = "2"
# PulseAudio's names for devices, which PipeWire serves too: the names calls see.
cpal = { version = "0.18", features = ["pulseaudio"] }
# The widget window reports asynchronous top-level load failures from WebKitGTK.
webkit2gtk = "3"
# Video in the attachment preview: Rune's player covers macOS and Windows only, so GStreamer
# decodes here, with whatever codecs the system has, into frames Rune draws.
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"

[lints]
workspace = true
