[package]
name = "matrix-core"
description = "Matrix client core shared by every Better Matrix app: accounts, sessions and the view models the UIs render."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
eyeball-im.workspace = true
futures-util.workspace = true
getrandom.workspace = true
# Scales thumbnails a server sends larger than asked for down to their box (src/thumbnail.rs),
# and reads the size of pictures added to image packs (src/packs.rs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
livekit = { workspace = true, optional = true }
matrix-sdk.workspace = true
matrix-sdk-ui.workspace = true
matrix-sdk-base.workspace = true
ruma.workspace = true
mime_guess.workspace = true
nokhwa = { workspace = true, optional = true }
# Draws QR codes for others to scan (src/qr.rs).
qrcode = { version = "0.14", default-features = false }
# Reads QR codes from camera pictures on the phones (src/qr.rs).
rqrr = { version = "0.11", default-features = false }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile = { version = "3", optional = true }
tokio.workspace = true
tracing.workspace = true
url.workspace = true
ts-rs = { workspace = true, optional = true }
zune-core = { workspace = true, optional = true }
zune-jpeg = { workspace = true, optional = true }
pulldown-cmark = { version = "0.13.6", default-features = false }

# Android trusts Mozilla's roots (src/tls.rs).
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

# Phones install ring as rustls' provider (see Engine::start).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rustls = { workspace = true, features = ["ring"] }

[features]
default = ["client", "native-media"]
native-media = [
  "dep:livekit",
  "dep:nokhwa",
  "dep:maplibre-native-ffi",
  "dep:waterkit-location",
  "dep:waterkit-permission",
  "dep:ashpd",
  "dep:zune-core",
  "dep:zune-jpeg",
]
# Typed operations used by terminal clients, outside the mobile wire format.
command-line = ["ffi", "dep:tempfile"]
# Ruma's request macros generate a request's client side under a `client` feature of the crate
# using them, its server side under `server` (never built): the MSC4140 requests the pinned ruma
# lacks (src/scheduled/api.rs).
client = []
server = []
# Serde and TypeScript derives on every type that crosses the engine boundary, for apps that
# talk to the engine as JSON (the mobile bridge, `packages/matrix-ffi`).
ffi = ["dep:ts-rs"]

[dev-dependencies]
# A paused clock, for tests of waits.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Windows needs a prebuilt MapLibre archive with the same static MSVC runtime as libwebrtc.
maplibre-native-ffi = { version = "=0.202610.3", optional = true }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
waterkit-location = { version = "0.3", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
waterkit-permission = { version = "0.3", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", features = ["location"], optional = true }
