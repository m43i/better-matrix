[package]
name = "matrix-core"
description = "Matrix client core shared by every Better Matrix app: accounts, sessions and the view models the UIs render."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64.workspace = true
eyeball-im.workspace = true
futures-util.workspace = true
getrandom.workspace = true
# Reads tiles' `Expires` for the map tile cache (src/geo.rs).
httpdate = "1"
# Scales thumbnails a server sends larger than asked for down to their box (src/thumbnail.rs).
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
livekit.workspace = true
matrix-sdk.workspace = true
matrix-sdk-ui.workspace = true
matrix-sdk-base.workspace = true
ruma.workspace = true
mime_guess.workspace = true
nokhwa.workspace = true
# Draws QR codes for others to scan (src/qr.rs).
qrcode = { version = "0.14", default-features = false }
# Reads QR codes from camera pictures on the phones (src/qr.rs).
rqrr = { version = "0.11", default-features = false }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
url.workspace = true
ts-rs = { workspace = true, optional = true }
zune-core.workspace = true
zune-jpeg.workspace = true
pulldown-cmark = { version = "0.13.6", default-features = false }

# Android trusts Mozilla's roots (src/tls.rs).
[target.'cfg(target_os = "android")'.dependencies]
webpki-root-certs = "1"

# Phones install ring as rustls' provider (see Engine::start).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
rustls = { workspace = true, features = ["ring"] }

[features]
default = ["client"]
# Ruma's request macros generate a request's client side under a `client` feature of the crate
# using them, its server side under `server` (never built): the MSC4140 requests the pinned ruma
# lacks (src/scheduled/api.rs).
client = []
server = []
# Serde and TypeScript derives on every type that crosses the engine boundary, for apps that
# talk to the engine as JSON (the mobile bridge, `packages/matrix-ffi`).
ffi = ["dep:ts-rs"]

[lints]
workspace = true
