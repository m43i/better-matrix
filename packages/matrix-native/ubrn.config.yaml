# uniffi-bindgen-react-native: builds packages/matrix-ffi for the phones and generates the JSI
# turbo module around it (ADR 0010). `bun run ubrn:android` / `bun run ubrn:ios`.
rust:
  directory: ../..
  manifestPath: packages/matrix-ffi/Cargo.toml
bindings:
  cpp: cpp/generated
  ts: src/generated/bridge
android:
  # The emulator first: the slowest step of a build is linking libwebrtc per target.
  targets:
    - arm64-v8a
    - x86_64
  apiLevel: 26
  useSharedLibrary: true
ios:
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
  frameworkName: build/MatrixNativeFramework
