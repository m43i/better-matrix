name: Feature request
description: Something Better Matrix should do.
labels: ['feature', 'needs-triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: What you'd like to do
      description: The situation and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: Your idea, if you have one. Sketches and examples from other apps help.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead now
