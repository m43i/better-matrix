# Lint and test: on every pull request, on every commit to main, and (called) before a release
# when its commit hasn't passed here already. One Linux job: the code is the same on every
# platform, and the release builds catch platform breakage. It covers the mobile app's
# TypeScript (typecheck and Jest) too; releases build only the desktop app for now.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: The commit to test (the caller's when empty).
        type: string
        default: ''

permissions:
  contents: read

# A newer push to a pull request makes its older run pointless. Every other run (main, a
# release's tests) has a group of its own, so none cancels or holds up another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts and full debug info only cost cache space here.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  update-helpers:
    name: Update helpers (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Test replacement, restart and rollback (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s .github/scripts -p test_update_helpers.py -v
      - name: Test replacement, restart and rollback (macOS)
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s .github/scripts -p test_update_helpers.py -v
      # A system executable stands in for the app: the installer and the helper only move it.
      - name: Check Windows installer, update and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force target\release | Out-Null
          Copy-Item "$env:SystemRoot\System32\whoami.exe" target\release\better-matrix.exe
          packaging/windows/package.ps1 0.0.0-rc.1
          Expand-Archive dist\out\better-matrix-windows-x86_64.zip dist\check
          foreach ($file in 'better-matrix.exe', 'better-matrix.ico', 'LICENSE') {
            if (!(Test-Path "dist\check\$file")) { throw "The ZIP lacks $file" }
          }
          $setup = Start-Process dist\out\better-matrix-windows-x86_64-setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($setup.ExitCode -ne 0) { throw "Setup failed with exit code $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Better Matrix"
          foreach ($file in 'better-matrix.exe', 'better-matrix.ico', 'LICENSE', 'unins000.exe') {
            if (!(Test-Path "$app\$file")) { throw "The install lacks $file" }
          }
          if (!(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Better Matrix.lnk")) {
            throw 'The Start menu entry is missing'
          }
          $command = (Get-Item 'HKCU:\Software\Classes\matrix\shell\open\command').GetValue('')
          if ($command -ne "`"$app\better-matrix.exe`" `"%1`"") { throw "Unexpected matrix: handler $command" }
          $entry = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{DB776B2C-C930-4C78-B82D-3BACD4B141C9}_is1'
          if ((Get-ItemProperty $entry).DisplayVersion -ne '0.0.0-rc.1') { throw 'The installed version is wrong' }

          # The self-update replaces the installed executable and keeps the listed version current.
          $gone = Start-Process cmd.exe -ArgumentList '/c', 'exit' -PassThru -WindowStyle Hidden
          $gone.WaitForExit()
          $work = New-Item -ItemType Directory "$app\.better-matrix-update-check"
          Copy-Item "$env:SystemRoot\System32\hostname.exe" "$work\better-matrix.exe"
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive `
            -ExecutionPolicy Bypass -File apps\desktop\src\platform\updates\install.ps1 `
            "$app\better-matrix.exe" "$work\better-matrix.exe" $gone.Id "$work" "$env:RUNNER_TEMP\update-error.txt" 0.0.1
          if ($LASTEXITCODE -ne 0) { throw "The update helper failed: $(Get-Content -Raw "$env:RUNNER_TEMP\update-error.txt")" }
          if ((Get-FileHash "$app\better-matrix.exe").Hash -ne (Get-FileHash "$env:SystemRoot\System32\hostname.exe").Hash) {
            throw 'The update did not replace the executable'
          }
          if ((Get-ItemProperty $entry).DisplayVersion -ne '0.0.1') { throw 'The update did not set the listed version' }

          $uninstall = Start-Process "$app\unins000.exe" -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed with exit code $($uninstall.ExitCode)" }
          # The uninstaller finishes from a copy of itself; give it a moment.
          for ($i = 0; (Test-Path $app) -and $i -lt 60; $i++) { Start-Sleep -Milliseconds 500 }
          if (Test-Path $app) { throw "Uninstalling left $(Get-ChildItem -Recurse -Name $app)" }
          if (Test-Path 'HKCU:\Software\Classes\matrix') { throw 'Uninstalling left the matrix: handler' }
          if (Test-Path $entry) { throw 'Uninstalling left the Installed apps entry' }
      # A self-signed certificate stands in for a real one. Windows doesn't trust it, so the checks
      # compare the signer rather than asking for a trusted signature.
      - name: Check Windows signing with signtool
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item -Recurse -Force dist
          Copy-Item -Force "$env:SystemRoot\System32\whoami.exe" target\release\better-matrix.exe
          $certificate = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Better Matrix CI' `
            -KeyExportPolicy Exportable -CertStoreLocation Cert:\CurrentUser\My
          $env:WINDOWS_CERTIFICATE = [Convert]::ToBase64String($certificate.Export('Pfx', 'ci'))
          $env:WINDOWS_CERTIFICATE_PASSWORD = 'ci'
          Remove-Item "Cert:\CurrentUser\My\$($certificate.Thumbprint)" -DeleteKey
          packaging/windows/package.ps1 0.0.0-rc.1
          if (Test-Path "Cert:\CurrentUser\My\$($certificate.Thumbprint)") { throw 'Packaging left the certificate installed' }
          function Assert-Signed([string]$File) {
            $signature = Get-AuthenticodeSignature -LiteralPath $File
            if ($signature.SignerCertificate.Thumbprint -ne $certificate.Thumbprint) {
              throw "$File isn't signed with the certificate: $($signature.Status) $($signature.StatusMessage)"
            }
            if (!$signature.TimeStamperCertificate) { throw "$File has no timestamp" }
          }
          Expand-Archive dist\out\better-matrix-windows-x86_64.zip dist\check
          Assert-Signed dist\check\better-matrix.exe
          Assert-Signed dist\out\better-matrix-windows-x86_64-setup.exe
          $setup = Start-Process dist\out\better-matrix-windows-x86_64-setup.exe -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($setup.ExitCode -ne 0) { throw "Setup failed with exit code $($setup.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Programs\Better Matrix"
          Assert-Signed "$app\unins000.exe"
          $uninstall = Start-Process "$app\unins000.exe" -Wait -PassThru `
            -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
          if ($uninstall.ExitCode -ne 0) { throw "Uninstall failed with exit code $($uninstall.ExitCode)" }
      - name: Check macOS update archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p target/release
          printf 'int main(void) { return 0; }' | clang -x c -o target/release/better-matrix -
          packaging/macos/package.sh 0.0.0
          ditto -x -k dist/out/better-matrix-macos-arm64.zip dist/check
          codesign --verify --deep --strict 'dist/check/Better Matrix.app'
          test -f 'dist/check/Better Matrix.app/Contents/Resources/better-matrix.icns'
          test -f 'dist/check/Better Matrix.app/Contents/Info.plist'
          test -x 'dist/check/Better Matrix.app/Contents/MacOS/better-matrix'
          # The disk image: the signed app, Applications to drag it to, and the window's layout.
          hdiutil attach -nobrowse -readonly -mountpoint dist/volume dist/out/better-matrix-macos-arm64.dmg
          codesign --verify --deep --strict 'dist/volume/Better Matrix.app'
          test "$(readlink dist/volume/Applications)" = /Applications
          test -f dist/volume/.DS_Store
          test -f dist/volume/.background.tiff
          test -f dist/volume/.VolumeIcon.icns
          hdiutil detach dist/volume
      # A self-signed certificate stands in for a Developer ID; without an API key nothing is
      # notarized.
      - name: Check macOS Developer ID signing
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf dist
          cat > "$RUNNER_TEMP/certificate.cnf" <<'EOF'
          [req]
          distinguished_name = name
          x509_extensions = extensions
          prompt = no
          [name]
          CN = Better Matrix CI
          [extensions]
          keyUsage = critical, digitalSignature
          extendedKeyUsage = critical, codeSigning
          EOF
          # macOS's own LibreSSL writes a .p12 that `security import` reads.
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 1 -config "$RUNNER_TEMP/certificate.cnf" \
            -keyout "$RUNNER_TEMP/key.pem" -out "$RUNNER_TEMP/certificate.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$RUNNER_TEMP/key.pem" -in "$RUNNER_TEMP/certificate.pem" \
            -out "$RUNNER_TEMP/certificate.p12" -passout pass:ci
          MACOS_CERTIFICATE=$(base64 < "$RUNNER_TEMP/certificate.p12") MACOS_CERTIFICATE_PASSWORD=ci \
            packaging/macos/package.sh 0.0.0
          if security list-keychains -d user | grep -q signing.keychain; then
            echo 'Packaging left its keychain in the search list'; exit 1
          fi
          test ! -e dist/signing.keychain-db
          ditto -x -k dist/out/better-matrix-macos-arm64.zip dist/check
          app='dist/check/Better Matrix.app'
          codesign --verify --deep --strict "$app"
          details=$(codesign -dvv "$app" 2>&1)
          grep -q 'Authority=Better Matrix CI' <<<"$details"
          grep -q 'flags=.*runtime' <<<"$details"
          grep -q 'Timestamp=' <<<"$details"
          codesign -d --entitlements - "$app" 2>/dev/null | grep -q com.apple.security.device.audio-input
          codesign -dvv dist/out/better-matrix-macos-arm64.dmg 2>&1 | grep -q 'Authority=Better Matrix CI'

  test:
    name: Lint and test
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Test release preparation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: ./.github/actions/linux-deps
      # The toolchain rust-toolchain.toml pins, with clippy and rustfmt.
      - run: rustup show active-toolchain || rustup toolchain install
      # Pull requests read main's cache; only main writes it, so caches don't pile up per branch.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The mobile app's and matrix-native's tests run Jest under Node, in a version Expo supports.
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
