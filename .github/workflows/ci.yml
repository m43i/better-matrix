# Lint and test: on every pull request, on every commit to main, and (called) before a release
# when its commit hasn't passed here already. One Linux job: the code is the same on every
# platform, and the release builds catch platform breakage. It covers the mobile app's
# TypeScript (typecheck and Jest) too; releases build only the desktop app for now.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: The commit to test (the caller's when empty).
        type: string
        default: ''

permissions:
  contents: read

# A newer push to a pull request makes its older run pointless. Every other run (main, a
# release's tests) has a group of its own, so none cancels or holds up another.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts and full debug info only cost cache space here.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  update-helpers:
    name: Update helpers (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-26, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Test replacement, restart and rollback (Windows)
        if: runner.os == 'Windows'
        run: python -m unittest discover -s .github/scripts -p test_update_helpers.py -v
      - name: Test replacement, restart and rollback (macOS)
        if: runner.os == 'macOS'
        run: python3 -m unittest discover -s .github/scripts -p test_update_helpers.py -v
      - name: Check macOS update archive
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p target/release
          printf 'int main(void) { return 0; }' | clang -x c -o target/release/better-matrix -
          packaging/macos/package.sh 0.0.0
          ditto -x -k dist/out/better-matrix-macos-arm64.zip dist/check
          codesign --verify --deep --strict 'dist/check/Better Matrix.app'
          test -f 'dist/check/Better Matrix.app/Contents/Resources/better-matrix.icns'
          test -f 'dist/check/Better Matrix.app/Contents/Info.plist'
          test -x 'dist/check/Better Matrix.app/Contents/MacOS/better-matrix'

  test:
    name: Lint and test
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Test release preparation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - uses: ./.github/actions/linux-deps
      # The toolchain rust-toolchain.toml pins, with clippy and rustfmt.
      - run: rustup show active-toolchain || rustup toolchain install
      # Pull requests read main's cache; only main writes it, so caches don't pile up per branch.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # The mobile app's and matrix-native's tests run Jest under Node, in a version Expo supports.
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
