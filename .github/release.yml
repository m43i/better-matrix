# Release notes, generated from the merged pull requests by their labels (see labels.yml).
changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - wontfix
  categories:
    - title: 💥 Breaking changes
      labels: [breaking]
    - title: ✨ New features
      labels: [feature]
    - title: 🔒 Security
      labels: [security]
    - title: 🚀 Improvements
      labels: [enhancement, performance, accessibility, i18n]
    - title: 🐛 Bug fixes
      labels: [bug]
    - title: 📚 Documentation
      labels: [documentation]
    - title: 🧰 Maintenance
      labels: [ci, dependencies]
    - title: Other changes
      labels: ['*']
